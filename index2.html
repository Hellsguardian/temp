<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            width: 350px;
            background: #fff;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
        }

        .top {
            background: #2f7df4;
            height: 120px;
            position: relative;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 5px solid white;
            position: absolute;
            bottom: -55px;
            left: 50%;
            transform: translateX(-50%);
        }

        .content {
            padding: 70px 20px 20px;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
        }

        p.role {
            font-size: 14px;
            color: #777;
            margin-bottom: 15px;
        }

        /* Social Icons */
        .social {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .social i {
            font-size: 20px;
            color: #fff;
        }

        .social div {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .fb { background: #000000; }
        .tw { background: #060004; }
        .ig { background: #e1306c; }
        .yt { background: #ff0000; }

        /* Buttons */
        .btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btns button {
            padding: 10px 25px;
            border-radius: 25px;
            background: #2f7df4;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btns button:hover {
            opacity: 0.9;
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: space-around;
            padding: 15px 0 20px;
            border-top: 1px solid #eee;
        }

        .stats div {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            color: #444;
        }

        .stats i {
            color: #777;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="top">
            <img src="https://i.pravatar.cc/300" class="profile-img">
        </div>

        <div class="content">
            <h2>CodingLab</h2>
            <p class="role">YouTuber & Blogger</p>

            <div class="social">
                <div class="fb"><i class="fab fa-facebook-f"></i></div>
                <div class="tw"><i class="fab fa-twitter"></i></div>
                <div class="ig"><i class="fab fa-instagram"></i></div>
                <div class="yt"><i class="fab fa-youtube"></i></div>
            </div>

            <div class="btns">
                <button>Subscribe</button>
                <button>Message</button>
            </div>

            <div class="stats">
                <div><i class="fa-regular fa-heart"></i> 60k</div>
                <div><i class="fa-regular fa-comment"></i> 20k</div>
                <div><i class="fa-solid fa-share"></i> 12k</div>
            </div>
        </div>
    </div>

</body>
</html>
